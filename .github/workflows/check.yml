name: Check and package workbench
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image attribution dependency
        run: python3 -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Install CI-only validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild both website editions
        id: build
        run: npm run build
      - name: Validate content and application behavior
        run: npm run check
      - name: Verify committed generated files are current
        run: |
          git diff --exit-code -- dist site-dist
          test -z "$(git ls-files --others --exclude-standard -- dist site-dist)"
      - name: Package public website
        run: npm run package
      - name: Upload versioned website package
        uses: actions/upload-artifact@v4
        with:
          name: pro-tools-workbench-website
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve generated website for review
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: generated-website-for-review
          path: site-dist/
          if-no-files-found: error
          retention-days: 7
