name: Check and package workbench
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build_data.py
      - run: npm run check
      - name: Package standalone website
        if: github.event.repository.private == true
        run: cd dist && zip -r ../pro-tools-workbench.zip .
      - uses: actions/upload-artifact@v4
        if: github.event.repository.private == true
        with:
          name: pro-tools-workbench-website
          path: pro-tools-workbench.zip
          retention-days: 30
