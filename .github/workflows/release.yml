name: Publish versioned website release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  release:
    # Rewriting an existing tag must not recreate or replace a published release.
    if: github.event.created == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image attribution dependency
        run: python3 -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Install CI-only validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild and validate
        run: |
          npm run build
          npm run check
          git diff --exit-code -- dist site-dist
          test -z "$(git ls-files --others --exclude-standard -- dist site-dist)"
      - name: Package matching version
        run: python3 scripts/package_release.py --version "${GITHUB_REF_NAME#v}"
      - name: Sign official build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # actions/attest@v4
        with:
          subject-path: release/*.zip
      - name: Preserve and verify provenance bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" release/provenance.sigstore.json
          gh attestation verify release/*.zip --repo "$GITHUB_REPOSITORY"
      - name: Publish ZIP, checksum and signed provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.zip release/SHA256SUMS.txt release/provenance.sigstore.json \
            --verify-tag \
            --title "Pro Tools 工作台 $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
